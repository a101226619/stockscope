<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="StockScope 定期定額複利試算，美股投資教育互動工具。"><title>定期定額複利試算｜StockScope</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="../index.html">Stock<span>Scope</span></a><nav class="links" aria-label="主要導覽"><a href="../index.html">首頁</a><a href="compare.html">ETF 比較</a><a href="calculator.html">定期定額試算</a><a href="../index.html#learn">知識庫</a></nav></div></header><main><section class="container tool-heading"><div class="eyebrow">RESEARCH TOOL / 02</div><h1>定期定額 <span class="accent">複利試算</span></h1><p class="lead">調整投資金額與假設報酬率，探索長期累積的數學效果。非報酬預測或投資建議。</p><div class="tool-layout" data-calculator><div class="control-panel"><h2>試算條件</h2><div class="field"><label for="monthly">每月底投入（新台幣）</label><input id="monthly" name="monthly" type="number" min="0" max="10000000" step="100" value="3000"></div><div class="field"><label for="initial">初始投入（新台幣）</label><input id="initial" name="initial" type="number" min="0" max="100000000" step="100" value="0"></div><div class="field"><label for="years">投資年數（1–40 年）</label><input id="years" name="years" type="number" min="1" max="40" step="1" value="10"></div><div class="field"><label for="rate">假設年化報酬率（%）</label><input id="rate" name="rate" type="number" min="-30" max="30" step="0.5" value="7"></div><p data-error role="alert" style="color:#ffb6a8"></p><p class="fineprint">以固定有效年報酬率換算月報酬率，每月底投入、每月複利。未計稅、手續費、通膨與匯率；實際市場報酬不固定。</p></div><div class="result-panel"><span class="tag">ESTIMATED RESULT</span><h2>預估最終資產</h2><h1 class="accent" data-total>—</h1><div class="metric-grid"><div class="metric"><small>投入本金</small><strong data-principal>—</strong></div><div class="metric"><small>預估收益／損失</small><strong data-profit>—</strong></div></div><h3>資產成長模擬 <small class="muted" data-period></small></h3><div class="chart-wrap" data-chart></div><div class="legend"><span><b></b>預估資產</span><span><b class="invested"></b>累積本金</span></div></div></div><div class="note">提醒：負報酬情境下資產可能低於投入本金；試算結果僅為數學模型，不代表未來市場表現。</div></section></main><footer class="footer"><div class="container"><span>© <span data-year></span> StockScope</span><span>教育用途 · 無即時報價 · 非投資建議</span></div></footer><script src="../assets/app.js"></script></body></html>
